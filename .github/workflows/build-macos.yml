name: Build macOS plug-ins

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DDREAMWAVE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Make sure Rosetta is available (for x86_64 tests, like Live 10 on Apple Silicon)
        run: arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license

      - name: Validate Audio Unit (arm64 + x86_64)
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aumu Dwsy Dwav
          arch -x86_64 auval -strict -v aumu Dwsy Dwav

      - name: Integration tests (AU + VST3, arm64 + x86_64)
        run: |
          HOST=build/tests/DwIntegrationHost_artefacts/Release/DwIntegrationHost
          OUT=build/DreamwaveSynth_artefacts/Release
          mkdir -p test-results
          status=0
          for a in arm64 x86_64; do
            for p in "$OUT/AU/Dreamwave Synth.component" "$OUT/VST3/Dreamwave Synth.vst3"; do
              f=$(basename "$p" | sed 's/.*\.//')
              demo=""; [ "$a" = arm64 ] && [ "$f" = vst3 ] && demo=test-results/presets-demo.wav
              arch -$a "$HOST" "$p" $demo | tee "test-results/$f-$a.log" || status=1
            done
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DreamwaveSynth-test-results
          path: test-results/

      - name: Sign (ad hoc) and zip
        run: |
          OUT=build/DreamwaveSynth_artefacts/Release
          codesign --force --deep -s - "$OUT/VST3/Dreamwave Synth.vst3"
          codesign --force --deep -s - "$OUT/AU/Dreamwave Synth.component"
          ditto -c -k --keepParent "$OUT/VST3/Dreamwave Synth.vst3" DreamwaveSynth-VST3-mac.zip
          ditto -c -k --keepParent "$OUT/AU/Dreamwave Synth.component" DreamwaveSynth-AU-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DreamwaveSynth-mac
          path: DreamwaveSynth-*-mac.zip
