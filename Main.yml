name: Build macOS VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Sign (ad hoc) and zip
        run: |
          PLUGIN="build/DreamwaveSynth_artefacts/Release/VST3/Dreamwave Synth.vst3"
          codesign --force --deep -s - "$PLUGIN"
          ditto -c -k --keepParent "$PLUGIN" DreamwaveSynth-VST3-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DreamwaveSynth-VST3-mac
          path: DreamwaveSynth-VST3-mac.zip
